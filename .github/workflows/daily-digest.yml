name: Big Tech News Digest

on:
  # Deploy when code changes on main
  push:
    branches:
      - main

  # Scrape every 2 hours. Many feeds only hold the last few hours of articles
  # (Bloomberg ~9h, Techmeme ~4h), so a single daily run misses most of the day.
  # Each run merges new articles into today's and yesterday's files and refreshes
  # last week's and last month's digests from the daily files.
  schedule:
    - cron: '17 */2 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Scraper mode'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - rebuild
          - rescore
          - backfill

# Never let two runs write the data branch at the same time
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # push to the data branch
      issues: write     # open/close feed-health issues
      pages: write
      id-token: write

    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4

      # Scraped content lives on the `data` branch so main only holds code
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper (scheduled)
        if: ${{ github.event_name == 'schedule' }}
        run: npm run scrape:daily

      - name: Run scraper (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scraper/index.js --${{ github.event.inputs.mode }}

      - name: Build static site
        run: npm run build

      - name: Commit to data branch
        if: ${{ github.event_name != 'push' }}
        working-directory: data
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "📰 Update digest $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git push origin HEAD:data && exit 0
            git pull --rebase origin data
          done
          exit 1

      - name: Open or close feed-health issues
        if: ${{ github.event_name != 'push' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/feed-issues.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
